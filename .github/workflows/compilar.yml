# Compila el APK (Android) y el EXE (Windows) en cada push a main
# y los publica en la página de Releases del repositorio.
name: Compilar apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      # Micrófono para cargar gastos por voz.
      - name: Permisos de Android
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <queries><intent><action android:name="android.speech.RecognitionService" /></intent></queries>#' $MANIFEST
          grep -q RECORD_AUDIO $MANIFEST || { echo "::error::No se pudo agregar el permiso de micrófono"; exit 1; }

      - name: Versión de la app
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      # Siempre la misma firma: así cada APK nuevo se instala encima del anterior sin perder datos.
      - name: Firma
        run: |
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  firma {
                      storeFile file('../../android-firma/debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  release { signingConfig signingConfigs.firma }
              }
          }
          EOF

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../MisGastos.apk

      - name: Verificar firma
        run: |
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          $APKSIGNER verify --print-certs MisGastos.apk | tee firma.txt
          grep -q 'a817f346feeb8087d7c5ade833267fec79652204d9ecd1af505ad98d2145bf18' firma.txt \
            || { echo "::error::El APK no quedó firmado con android-firma/debug.keystore"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: MisGastos.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install

      - name: Compilar EXE
        run: npm run build:exe

      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: dist/MisGastos.exe

  publicar:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Mis Gastos 1.0.${{ github.run_number }}
          body: |
            - **Android:** descargá `MisGastos.apk` desde el celular e instalalo (permití "instalar apps de origen desconocido").
            - **Windows:** descargá `MisGastos.exe` y abrilo con doble clic.
          files: |
            MisGastos.apk
            MisGastos.exe

  # Página de descarga + versión web en https://karimnajul.github.io/mis.gastos/
  pagina:
    needs: publicar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Armar sitio
        run: |
          mkdir -p _site/app
          cp sitio/index.html _site/
          cp -r www/* _site/app/

      - uses: actions/upload-pages-artifact@v3

      - id: deploy
        uses: actions/deploy-pages@v4
